chunk_size: 256
remote_url: "mooncakestore://127.0.0.1:50051/"
remote_serde: "naive"

# Optional local buffer
local_cpu: false
max_local_cpu_size: "2.0" # GiB
numa_mode: "auto"

# Mooncake connector requires extra_config. For multi-node, keep one shared file
# and let each node override (or rely on) `local_hostname` via env expansion.
extra_config:
  # Use a resolvable hostname or an IP; by default it expands to $HOSTNAME.
  local_hostname: "${HOSTNAME}"
  metadata_server: "http://127.0.0.1:8080/metadata"
  master_server_address: "127.0.0.1:50051"
  protocol: "tcp" # tcp|rdma
  device_name: "" # autodetect
  global_segment_size: 21474836480 # 20 GiB per worker
  local_buffer_size: 0
  mooncake_prefer_local_alloc: true
