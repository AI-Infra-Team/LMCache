# LMCache 的基本设置
chunk_size: 256
remote_serde: "naive"            # Mooncake 示例中使用 naive 序列化
remote_url: "mooncakestore://127.0.0.1:50051"  # Mooncake 服务地址
# 本地缓存设置
local_cpu: false                 # 不使用本地 CPU 缓存
max_local_cpu_size: "8.0"        # 单位 GB
# Mooncake 专属额外配置
extra_config:
  # 当前节点的主机名或 IP，用于注册
  local_hostname: "dell03"
  metadata_server: "etcd://192.168.0.207:32579"
  # 再次指定 Master 地址 (部分版本要求)
  master_server_address: "127.0.0.1:50051"
  # 传输协议 (tcp 或 rdma)
  protocol: "tcp"